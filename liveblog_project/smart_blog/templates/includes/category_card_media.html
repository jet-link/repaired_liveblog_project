{% load category_cards %}
{% category_card_theme item.category as cat_theme %}
<div class="brain-card__media{% if media_modifier %} {{ media_modifier }}{% endif %}">
  {% if item.images.first %}
    <img src="{{ item.images.first.get_thumbnail_url }}" alt="" class="brain-card__img" loading="lazy" decoding="async" />
  {% elif item.videos.first %}
    {% with vid=item.videos.first %}
      {% if vid.thumbnail %}
        <img src="{{ vid.thumbnail.url }}" alt="" class="brain-card__img" loading="lazy" decoding="async" />
      {% else %}
        <div class="brain-card__placeholder brain-card__placeholder--{{ cat_theme.slug }}" aria-hidden="true">
          <span class="brain-card__placeholder-icon"><i class="fa {{ cat_theme.icon }}" aria-hidden="true"></i></span>
        </div>
      {% endif %}
    {% endwith %}
  {% else %}
    <div class="brain-card__placeholder brain-card__placeholder--{{ cat_theme.slug }}" aria-hidden="true">
      <span class="brain-card__placeholder-icon"><i class="fa {{ cat_theme.icon }}" aria-hidden="true"></i></span>
    </div>
  {% endif %}
  {% if rank %}
    <span class="brain-card__rank">#{{ rank }}</span>
  {% endif %}
</div>
