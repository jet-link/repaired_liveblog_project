<div class="filter-cards-wrapper" data-filter-type="{{ filter_type }}">
  {% if items %}
    <div class="feed-cards-grid-v2 feed-cards-grid-v2--pattern mb-2 filter-cards-row">
      {% include 'includes/filtered_cards_columns.html' %}
    </div>
    {% if page_obj.has_other_pages %}
    <div data-filter-pagination class="filter-pagination-host mt-4">
      {% include 'includes/pagination.html' %}
    </div>
    {% endif %}
  {% else %}
    <div class="filter-empty-message" data-filter-type="{{ filter_type }}">{{ empty_msg }}</div>
  {% endif %}
</div>
