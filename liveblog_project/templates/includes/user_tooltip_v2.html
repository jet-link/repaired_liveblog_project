<a href="{% url 'login_app:profile' user.username %}" class="user-tooltip-profile-row text-muted{% if nav_ns == 'login_app' and profile_u == user.username %}{% if nav_name == 'profile' or nav_name == 'profile-section' %} is-active{% endif %}{% endif %}"{% if nav_ns == 'login_app' and profile_u == user.username %}{% if nav_name == 'profile' or nav_name == 'profile-section' %} aria-current="page"{% endif %}{% endif %}>
  <i class="fa fa-user-circle me-3" aria-hidden="true"></i><span class="user-tooltip-profile-name fw-semibold" title="{{ user.username }}">{% if user.username|length > 15 %}{{ user.username|slice:":12" }}…{% else %}{{ user.username }}{% endif %}</span>
</a>
<a href="{% url 'login_app:notifications' user.username %}" class="notification-btn text-muted{% if notifications_count %} has-unread{% endif %}{% if nav_ns == 'login_app' and nav_name == 'notifications' and profile_u == user.username %} is-active{% endif %}" data-notifications-count="{{ notifications_count }}"{% if nav_ns == 'login_app' and nav_name == 'notifications' and profile_u == user.username %} aria-current="page"{% endif %}><i class="fa fa-bell me-3" aria-hidden="true"></i>Notifications</a>
<a href="{% url 'login_app:profile-themes' user.username %}" class="text-muted{% if nav_ns == 'login_app' and profile_u == user.username %}{% if nav_name == 'profile-themes' or nav_name == 'profile-reposts' %} is-active{% endif %}{% endif %}"{% if nav_ns == 'login_app' and profile_u == user.username %}{% if nav_name == 'profile-themes' or nav_name == 'profile-reposts' %} aria-current="page"{% endif %}{% endif %}><i class="fa fa-at me-3" aria-hidden="true"></i>My themes</a>
<a href="{% url 'smart_blog:create_post' %}" class="text-muted{% if nav_ns == 'smart_blog' and nav_name == 'create_post' %} is-active{% endif %}"{% if nav_ns == 'smart_blog' and nav_name == 'create_post' %} aria-current="page"{% endif %}><i class="fa fa-plus me-3" aria-hidden="true"></i>Create post</a>
<a href="{% url 'login_app:profile-edit' request.user.username %}" class="text-muted{% if nav_ns == 'login_app' and nav_name == 'profile-edit' and profile_u == user.username %} is-active{% endif %}"{% if nav_ns == 'login_app' and nav_name == 'profile-edit' and profile_u == user.username %} aria-current="page"{% endif %}><i class="fa fa-cog me-3" aria-hidden="true"></i>Edit profile</a>
<a href="#" class="danger signout-trigger"><i class="fa fa-sign-out me-3" aria-hidden="true"></i>Sign out</a>
